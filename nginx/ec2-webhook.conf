upstream chatbot_webhook_backend {
    zone chatbot_webhook_backend 64k;
    server bot-a:8080;
    server bot-b:8080;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/webhook.crt;
    ssl_certificate_key /etc/nginx/certs/webhook.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /healthz {
        proxy_pass http://chatbot_webhook_backend/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /telegram-webhook {
        proxy_pass http://chatbot_webhook_backend/telegram-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }
}
