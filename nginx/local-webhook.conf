upstream chatbot_webhook_backend {
    zone chatbot_webhook_backend 64k;
    server bot-a:8080;
    server bot-b:8080;
}

server {
    listen 8080;
    server_name _;

    location = /healthz {
        proxy_pass http://chatbot_webhook_backend/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /telegram-webhook {
        proxy_pass http://chatbot_webhook_backend/telegram-webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }
}
