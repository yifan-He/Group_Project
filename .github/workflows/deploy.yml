name: Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker_file
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot:latest

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Upload deployment file
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/group_project"
          scp -o StrictHostKeyChecking=no docker-compose.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/group_project/"

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd ~/group_project

          cat > .env << EOT
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/chatbot
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          CHATGPT_KEY=${{ secrets.CHATGPT_KEY }}
          CHATGPT_URL=${{ secrets.CHATGPT_URL }}
          CHATGPT_MODEL=${{ secrets.CHATGPT_MODEL }}
          CHATGPT_VER=${{ secrets.CHATGPT_VER }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}
          REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_DECODE_RESPONSES=${{ secrets.REDIS_DECODE_RESPONSES }}
          EOT

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker-compose -f docker-compose.yml pull
          docker-compose -f docker-compose.yml up -d --remove-orphans
          EOF
