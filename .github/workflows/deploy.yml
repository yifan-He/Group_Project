name: Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker_file
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot:latest

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Create config.ini from secret
        run: |
          if [ -z "${{ secrets.CONFIG_INI }}" ]; then
            echo "CONFIG_INI secret is missing"
            exit 1
          fi
          cat > config.ini << 'EOT'
          ${{ secrets.CONFIG_INI }}
          EOT

      - name: Upload deployment files (scp)
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/group_project"
          scp -o StrictHostKeyChecking=no docker-compose.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/group_project/"
          scp -o StrictHostKeyChecking=no config.ini "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/group_project/"

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          mkdir -p ~/group_project
          cd ~/group_project

          if ! command -v docker >/dev/null 2>&1; then
            sudo dnf install -y docker
            sudo systemctl enable --now docker
          fi

          sudo systemctl start docker || true

          if ! command -v docker-compose >/dev/null 2>&1; then
            sudo dnf install -y docker-compose
          fi

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          export IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/chatbot"
          docker-compose -f docker-compose.yml config
          docker-compose -f docker-compose.yml pull
          docker-compose -f docker-compose.yml up -d --remove-orphans
          docker-compose -f docker-compose.yml ps
          docker image prune -f
          EOF
